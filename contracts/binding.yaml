# === JSON Schema 2020-12 + Caching Hints (Phase 115) ===
# Written in wave 1, BEFORE the implementation plans run (CLAUDE.md § Contract-First
# Development). Every entry below carries the `planned` status EXCEPT
# `CallToolResult::structured`, which exists today and whose binding records the D-06
# freeze. A `planned` status means "this plan
# has not landed yet", NOT "this binding is exempt": tests/phase115_contract_bindings.rs
